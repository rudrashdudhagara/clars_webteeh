<html>
<center>
<head>
	<title>basic form</title>
</head>
<body bgcolor="lightblue">
		<h2><mark><font color="forest"> <b><u>**student registration form**</b></u></font></mark> </h2>
			<form>
			 <label><b><u>Name</u>:</b></label>
			 <input type="text" Name="name">
			 <br><br>
			 
			 <label><b><u>Email</u>:</b></label>
			 <input type="email" name="email">
			 <br><br>
			 
			 <label><b><u>Password</u>:</b></label>
			 <input type="password" name="password">
			 <br><br>
			 
			 <label><b><u>Age</u>:</b></label>
			 <input type="nuber" name="age">
			 <br><br>
			 
			 <label><b><u>Gender</u>:</b></label>
			 <input type="radio" name="gender" value="male">Male
			 <input type="radio" name="gender" value="female">Female
			 <br><br>
			 
			 <label><b><u>Hobbies</u>:</b></label>
			 <input type="checkbox" name="hobbies" value="cricket">Cricket
			 <input type="checkbox" name="hobbies" value="music">Music
			 <input type="checkbox" name="hobbies" value="reading">Reading
			 <br><br>
			 
			 <label><b><u>conrse</u>:</b></label>
			 <select name="course">
			 
				<option value="mca">MCA</option>
				<option value="bca">BCA</option>
				<option value="bscit">BSC.IT</option>
					</select>
					<br><br>
				
               <label><b><u>Address</u>:</b></label>
               <textarea name="address"></textarea>
               <br><br>
			
				
				<label><b><u>Date</u>:</b></label>
				<input type="date" name="date">
				<br><br>
				
				<label><b><u>Number</u>:</b></label>
				<input type="nuber" name="nuber">
				<br><br>
				
				<label><b><u>Range</u>:</b></label>
				0<input type="range">100
				<br><br>
				
				<input type="submit" value="submit">
				<input type="reset"  value="Reset">
				
</form>

</body>
		
</center>		
</html>
